name: Step 3, DHCP Lease Management

# Triggers when dhcp/reservations.conf is pushed to main.
# Advances from step 3 to step 4.
on:
  workflow_dispatch:
  push:
    paths:
      - "dhcp/reservations.conf"
    branches:
      - main

permissions:
  contents: write

jobs:
  get_current_step:
    name: Check current step number
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - id: get_step
        run: echo "current_step=$(cat ./.github/steps/-step.txt)" >> $GITHUB_OUTPUT
    outputs:
      current_step: ${{ steps.get_step.outputs.current_step }}

  on_dhcp_reservations:
    name: On DHCP Reservations
    needs: get_current_step
    if: ${{ !github.event.repository.is_template && needs.get_current_step.outputs.current_step == 3 }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check reservations contain hardware ethernet
        uses: skills/action-check-file@v1
        with:
          file: "dhcp/reservations.conf"
          search: "hardware ethernet"
      - name: Update to step 4
        uses: skills/action-update-step@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          from_step: 3
          to_step: 4
