name: Step 4, DHCP Troubleshooting

# Triggers when dhcp/troubleshoot.sh is pushed to main.
# Advances from step 4 to X (finish).
on:
  workflow_dispatch:
  push:
    paths:
      - "dhcp/troubleshoot.sh"
    branches:
      - main

permissions:
  contents: write

jobs:
  get_current_step:
    name: Check current step number
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - id: get_step
        run: echo "current_step=$(cat ./.github/steps/-step.txt)" >> $GITHUB_OUTPUT
    outputs:
      current_step: ${{ steps.get_step.outputs.current_step }}

  on_dhcp_troubleshooting:
    name: On DHCP Troubleshooting
    needs: get_current_step
    if: ${{ !github.event.repository.is_template && needs.get_current_step.outputs.current_step == 4 }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check script contains diagnostic commands
        uses: skills/action-check-file@v1
        with:
          file: "dhcp/troubleshoot.sh"
          search: "dhcpd"
      - name: Update to finish step
        uses: skills/action-update-step@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          from_step: 4
          to_step: X
